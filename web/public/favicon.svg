<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .shadow { fill: #cbb6ef; }
    .win    { fill: #ffffff; stroke: #2a2238; }
    .bar    { fill: #6b4bb0; }
    @media (prefers-color-scheme: dark) {
      .shadow { fill: #c9b3f5; }
      .win    { fill: #1c1b20; stroke: #ecebf0; }
      .bar    { fill: #c9b3f5; }
    }
  </style>
  <!-- The kiiyoOS window: solid offset shadow, outlined window, accent title bar. -->
  <rect class="shadow" x="7" y="8" width="23" height="21"/>
  <rect class="win" x="3" y="4" width="22" height="20" stroke-width="2"/>
  <rect class="bar" x="4" y="5" width="20" height="5"/>
</svg>
